server:
  port: 8082

spring:
  application:
    name: backoffice-ws
  datasource:
    url: jdbc:postgresql://localhost:5432/backoffice_db
    username: backoffice_svc
    password: backoffice_pw
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=24h
    cache-names: departments,designations
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/kfg
          audiences: kfg-backoffice

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,loggers,httpexchanges
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    httpexchanges:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: KFG Backoffice Service
    version: 1.0-SNAPSHOT