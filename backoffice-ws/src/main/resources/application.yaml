server:
  port: 8082

spring:
  application:
    name: backoffice-ws
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/kfg
          audiences: kfg-backoffice

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,loggers,httpexchanges
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    httpexchanges:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: KFG Backoffice Service
    version: 1.0-SNAPSHOT