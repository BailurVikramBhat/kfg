server:
  port: ${KFG_GATEWAY_PORT:8080}

spring:
  application:
    name: gateway

kfg:
  security:
    customer-issuer: ${KFG_CUSTOMER_ISSUER:http://localhost:8081/realms/kfg-customers}
    employee-issuer: ${KFG_EMPLOYEE_ISSUER:http://localhost:8081/realms/kfg-employees}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
